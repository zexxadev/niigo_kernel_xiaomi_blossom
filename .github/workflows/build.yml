name: Build madaraKernel Blossom (Dual-Variant)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Vanilla, RSKSU-SusFS]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Apply Performance, GPU OC & Deep Sleep Patches
        run: |
          python3 - << 'EOF'
          import glob
          import re

          # 1. Matikan GENTLE_FAIR_SLEEPERS dan aktifkan NEXT_BUDDY
          feat_file = 'kernel/sched/features.h'
          with open(feat_file, 'r') as f:
              feat = f.read()

          feat_new, n1 = re.subn(
              r'(#define\s+SCHED_FEAT_GENTLE_FAIR_SLEEPERS\s+)1\b',
              r'\g<1>0',
              feat
          )
          if not n1:
              feat_new, n1 = re.subn(
                  r'SCHED_FEAT\(\s*GENTLE_FAIR_SLEEPERS\s*,\s*true\s*\)',
                  'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)',
                  feat
              )
          if n1:
              print("Patched NO_GENTLE_FAIR_SLEEPERS OK")

          feat_new, n_nb = re.subn(
              r'(#define\s+SCHED_FEAT_NEXT_BUDDY\s+)0\b',
              r'\g<1>1',
              feat_new
          )
          if not n_nb:
              feat_new, n_nb = re.subn(
                  r'SCHED_FEAT\(\s*NEXT_BUDDY\s*,\s*false\s*\)',
                  'SCHED_FEAT(NEXT_BUDDY, true)',
                  feat_new
              )
          if n_nb:
              print("Patched SCHED_FEAT_NEXT_BUDDY OK")

          if n1 or n_nb:
              with open(feat_file, 'w') as f:
                  f.write(feat_new)

          # 2. GPU Overclock PowerVR GE8320 -> 730 MHz
          gpu_patched = False

          for pattern in ['drivers/misc/mediatek/**/*.[ch]', 'drivers/gpu/**/*.[ch]']:
              for path in glob.glob(pattern, recursive=True):
                  if 'cpufreq' in path or 'eem' in path:
                      continue
                  with open(path, 'r', errors='ignore') as f:
                      txt = f.read()

                  if not any(k in txt for k in ('GPU_DVFS', 'gpufreq', 'mtk_gpufreq', 'rgx_mtk', 'mfg')):
                      continue

                  new_txt, n2 = re.subn(
                      r'(#define\s+(?:SEG_)?GPU_DVFS_FREQ0\s*\(?\s*)(?:650000|600000|520000)(\s*\)?)',
                      r'\g<1>730000\g<2>',
                      txt
                  )
                  if not n2 and ('gpu' in path.lower() or 'mfg' in path.lower()):
                      new_txt, n2 = re.subn(r'\b650000\b', '730000', txt)

                  if n2:
                      with open(path, 'w') as f:
                          f.write(new_txt)
                      print(f"Patched GPU OC 730MHz in {path} ({n2} entries) OK")
                      gpu_patched = True

          for dts in glob.glob('arch/arm64/boot/dts/**/*.dts*', recursive=True):
              with open(dts, 'r', errors='ignore') as f:
                  d_txt = f.read()
              if '650000000' in d_txt and ('gpu' in d_txt.lower() or 'mfg' in d_txt.lower()):
                  d_new, n_dts = re.subn(r'\b650000000\b', '730000000', d_txt)
                  if n_dts:
                      with open(dts, 'w') as f:
                          f.write(d_new)
                      print(f"Patched GPU DTS OPP 730MHz in {dts} ({n_dts} entries) OK")
                      gpu_patched = True

          if not gpu_patched:
              print("PERINGATAN: Tabel GPU belum ter-patch.")

          # 3. CPU Overclock Little Cluster (1.5 GHz -> 1.8 GHz)
          for cpu_f in glob.glob(
              'drivers/misc/mediatek/base/power/cpufreq_v1/**/*.[ch]',
              recursive=True
          ):
              with open(cpu_f, 'r') as f:
                  c_txt = f.read()

              new_c = re.sub(r'\b1500000\b', '1800000', c_txt)

              if new_c != c_txt:
                  with open(cpu_f, 'w') as f:
                      f.write(new_c)
                  print(f"Patched Little CPU OC (1.8GHz) in {cpu_f} OK")

          # 4. Deep Sleep Wakelock Blocker (Blokir wakelock noisy MTK/WiFi saat idle)
          wakeup_file = 'drivers/base/power/wakeup.c'
          with open(wakeup_file, 'r') as f:
              w_code = f.read()

          blocker_fn = (
              'static bool madara_is_blocked_wakelock(const char *name)\n'
              '{\n'
              '\tif (!name)\n'
              '\t\treturn false;\n'
              '\tif (!strcmp(name, "NETLINK") ||\n'
              '\t    !strcmp(name, "wlan_rx_wake") ||\n'
              '\t    !strcmp(name, "wlan_ctrl_wake") ||\n'
              '\t    !strcmp(name, "wlan_wake") ||\n'
              '\t    !strcmp(name, "SensorService") ||\n'
              '\t    !strncmp(name, "eventpoll", 9))\n'
              '\t\treturn true;\n'
              '\treturn false;\n'
              '}\n\n'
          )

          if 'madara_is_blocked_wakelock' not in w_code:
              w_new, nw = re.subn(
                  r'(static\s+void\s+wakeup_source_activate\s*\(\s*struct\s+wakeup_source\s*\*\s*ws\s*\)\s*\{)',
                  blocker_fn + r'\1\n\tif (madara_is_blocked_wakelock(ws->name))\n\t\treturn;',
                  w_code,
                  count=1
              )
              if nw:
                  with open(wakeup_file, 'w') as f:
                      f.write(w_new)
                  print("Patched Deep Sleep Wakelock Blocker in drivers/base/power/wakeup.c OK")
          EOF

      - name: Setup Variant (${{ matrix.variant }})
        run: |
          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then

            # 1. Setup ReSukiSU
            KSU_REF="d5e9e025b8b49155f8014684d64c91742b465f65"
            curl -LSs \
              "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
              | bash -s "$KSU_REF"

            # 2. Clone SUSFS v2.3.0 for Linux 4.19 non-GKI
            git clone --depth=1 \
              https://github.com/fabiannabil1/susfs-4.19-nongki.git \
              susfs419

            SUSFS_PATCH="$PWD/susfs419/patches/lge-sm8250-29902cf733dc/0002-susfs-v2.3.0-4.19.patch"

            if [ ! -f "$SUSFS_PATCH" ]; then
              echo "ERROR: File patch SUSFS tidak ditemukan!"
              find susfs419/patches -name "0002-susfs-v2.3.0-4.19.patch"
              exit 1
            fi

            ls -lh "$SUSFS_PATCH"

            # 3. Filter patch SUSFS
            echo "Filtering SUSFS patch..."
            python3 - "$SUSFS_PATCH" << 'PY'
          import re
          import sys
          import subprocess

          patch_file = sys.argv[1]

          with open(patch_file, "r", encoding="utf-8", errors="replace") as f:
              patch_text = f.read()

          chunks = re.split(r"(?=^diff --git )", patch_text, flags=re.MULTILINE)

          filtered_chunks = []
          excluded_cmdline = False
          excluded_mount = False

          for chunk in chunks:
              if not chunk.strip():
                  continue

              lines = chunk.splitlines(keepends=True)
              first_line = lines[0].strip()

              if re.match(r"^diff --git a/fs/proc/cmdline\.c b/fs/proc/cmdline\.c$", first_line):
                  excluded_cmdline = True
                  print("Excluded: fs/proc/cmdline.c")
                  continue

              if re.match(r"^diff --git a/fs/namespace\.c b/fs/namespace\.c$", first_line):
                  output = []
                  skip_hunk = False

                  for line in lines:
                      if line.startswith("@@ "):
                          skip_hunk = ("vfs_create_mount" in line)
                          if skip_hunk:
                              excluded_mount = True
                              print("Excluded incompatible hunk: fs/namespace.c / vfs_create_mount")

                      if not skip_hunk:
                          output.append(line)

                  filtered_chunks.append("".join(output))
              else:
                  filtered_chunks.append(chunk)

          if not excluded_cmdline:
              sys.exit("ERROR: Hunk fs/proc/cmdline.c tidak ditemukan.")

          if not excluded_mount:
              sys.exit("ERROR: Hunk vfs_create_mount tidak ditemukan. Periksa versi patch SUSFS.")

          filtered_patch = "\n".join(filtered_chunks)

          if not filtered_patch.strip():
              sys.exit("ERROR: Patch SUSFS kosong setelah filtering.")

          result = subprocess.run(
              ["patch", "-p1", "--no-backup-if-mismatch", "-F3"],
              input=filtered_patch,
              text=True
          )

          if result.returncode != 0:
              sys.exit("ERROR: Penerapan patch SUSFS gagal. Periksa file .rej.")

          print("SUSFS patch applied successfully.")
          PY

            # 4. Tampilkan file reject jika ada
            if find . -name "*.rej" -not -path "./susfs419/*" | grep -q .; then
              echo "=== PERINGATAN: DITEMUKAN FILE .REJ ==="
              find . -name "*.rej" -not -path "./susfs419/*" -exec head -n 80 {} +
              echo "ERROR: Ada patch yang ditolak."
              exit 1
            fi

            # 5. Validasi file SUSFS
            for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
              if [ ! -f "$f" ]; then
                echo "ERROR: $f tidak ditemukan setelah patch SUSFS"
                exit 1
              fi
              echo "OK: $f ditemukan"
            done

            # 6. Check required SUSFS constants
            for c in \
              CMD_SUSFS_ADD_SUS_PATH_LOOP \
              CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS \
              CMD_SUSFS_ADD_SUS_MAP \
              CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING; do
              grep -q "$c" include/linux/susfs_def.h || {
                echo "ERROR: $c tidak ditemukan di susfs_def.h"
                exit 1
              }
            done
            echo "susfs_def.h: semua CMD_SUSFS_* ditemukan"

            # 7. Ensure susfs.o is compiled
            if ! grep -q "susfs.o" fs/Makefile; then
              echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
              echo "Menambahkan susfs.o ke fs/Makefile"
            fi

            # 8. Check inline hooks
            echo "=== CEK HOOK SUSFS INLINE ==="
            for pair in \
              "kernel/sys.c:ksu_handle_setresuid" \
              "fs/exec.c:ksu_handle_execveat" \
              "fs/open.c:ksu_handle_faccessat" \
              "fs/read_write.c:ksu_handle_sys_read" \
              "fs/stat.c:ksu_handle_stat" \
              "fs/stat.c:ksu_handle_vfs_fstat" \
              "kernel/reboot.c:ksu_handle_sys_reboot" \
              "drivers/input/input.c:ksu_handle_input_handle_event"; do
              f="${pair%%:*}"
              h="${pair##*:}"
              if grep -q "$h" "$f"; then
                echo "OK    $h ($f)"
              else
                echo "MISS  $h ($f)"
              fi
            done

            # 9. Compatibility patch for Linux 4.19
            python3 - << 'EOF'
          import os
          import re

          pkg_obs = 'drivers/kernelsu/manager/pkg_observer.c'
          if os.path.exists(pkg_obs):
              with open(pkg_obs, 'r') as f:
                  code = f.read()

              code = code.replace('TWA_RESUME', 'true')

              if '.handle_inode_event' in code:
                  wrapper = (
                      'static int ksu_handle_event_419(struct fsnotify_group *group, struct inode *inode, '
                      'u32 mask, const void *data, int data_type, const unsigned char *file_name, '
                      'u32 cookie, struct fsnotify_iter_info *iter_info)\n'
                      '{\n'
                      '\tstruct qstr qname = { .name = file_name, .len = file_name ? strlen(file_name) : 0 };\n'
                      '\treturn ksu_handle_inode_event(NULL, mask, inode, inode, file_name ? &qname : NULL, cookie);\n'
                      '}\n\n'
                      'static const struct fsnotify_ops'
                  )
                  code = code.replace('static const struct fsnotify_ops', wrapper, 1)
                  code = re.sub(
                      r'\.handle_inode_event\s*=\s*ksu_handle_inode_event',
                      '.handle_event = ksu_handle_event_419',
                      code
                  )

              with open(pkg_obs, 'w') as f:
                  f.write(code)
              print("Patched pkg_observer.c for Linux 4.19 OK")
          EOF

            # 9b. Fix implicit declaration of filename_lookup di fs/open.c & fs/stat.c (SUSFS)
            python3 - << 'EOF'
          import re

          with open('fs/namei.c', 'r') as f:
              namei = f.read()
          namei_new, n = re.subn(r'\bstatic\s+(int\s+filename_lookup\s*\()', r'\1', namei)
          if n:
              with open('fs/namei.c', 'w') as f:
                  f.write(namei_new)
              print("Removed static from filename_lookup in fs/namei.c OK")

          decl = (
              '\nextern int filename_lookup(int dfd, struct filename *name, '
              'unsigned flags, struct path *path, struct path *root);\n'
          )
          for target in ['fs/open.c', 'fs/stat.c']:
              with open(target, 'r') as f:
                  code = f.read()
              if 'extern int filename_lookup(' not in code:
                  includes = list(re.finditer(r'^#include\s+[<"].*?[>"]', code, flags=re.MULTILINE))
                  last_inc_end = includes[-1].end()
                  code = code[:last_inc_end] + decl + code[last_inc_end:]
                  with open(target, 'w') as f:
                      f.write(code)
                  print(f"Added filename_lookup declaration after includes in {target} OK")
          EOF

            # 10. Enable KSU + SUSFS configuration
            cat << 'EOF' >> arch/arm64/configs/blossom_defconfig
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KPROBES is not set
          EOF

          fi

      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="ZexxaDev"
          export KBUILD_BUILD_HOST="GitHubActions"
          export LOCALVERSION="+"

          # Tambahan Defconfig: Network BBR, NOOP I/O, Deep Sleep & Power Efficiency
          cat << 'EOF' >> arch/arm64/configs/blossom_defconfig
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IOSCHED_NOOP=y
          CONFIG_DEFAULT_NOOP=y
          CONFIG_PM_AUTOSLEEP=y
          CONFIG_PM_WAKELOCKS=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          EOF

          make -j$(nproc --all) O=out ARCH=arm64 blossom_defconfig

          if [ "${{ matrix.variant }}" == "RSKSU-SusFS" ]; then
            grep -q "^CONFIG_KSU=y" out/.config || {
              echo "ERROR: CONFIG_KSU=y gagal aktif di .config!"
              exit 1
            }
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || {
              echo "ERROR: CONFIG_KSU_SUSFS=y gagal aktif di .config!"
              exit 1
            }
            if grep -q "^CONFIG_KSU_SUSFS_SUS_MOUNT=y" out/.config; then
              echo "ERROR: SUS_MOUNT masih aktif!"
              exit 1
            fi
            echo "OK: SUS_MOUNT dinonaktifkan."
          fi

          set -o pipefail

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log || {
              echo "=== RINGKASAN ERROR ==="
              grep -iE "error:|undefined symbol|undefined reference" build.log | tail -n 25
              exit 1
            }

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/zexxadev/AnyKernel3-blossom.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/

          cd anykernel

          sed -i 's/kernel.string=.*/kernel.string=madaraKernel 4.19.325 (${{ matrix.variant }}) by @zexxadev/g' anykernel.sh

          mkdir -p ramdisk

          # Konfigurasi GPS Fast-Lock (NTP Indonesia & SUPL Google)
          cat << 'EOF' > ramdisk/madara_gps.conf
          NTP_SERVER=id.pool.ntp.org
          NTP_SERVER=0.id.pool.ntp.org
          NTP_SERVER=1.id.pool.ntp.org
          NTP_SERVER=asia.pool.ntp.org
          XTRA_SERVER_1=https://xtrapath1.izatcloud.net/xtra3grc.bin
          XTRA_SERVER_2=https://xtrapath2.izatcloud.net/xtra3grc.bin
          XTRA_SERVER_3=https://xtrapath3.izatcloud.net/xtra3grc.bin
          SUPL_HOST=supl.google.com
          SUPL_PORT=7275
          SUPL_VER=0x20000
          SUPL_MODE=1
          LPP_PROFILE=2
          NMEA_PROVIDER=0
          A_GLONASS_POS_PROTOCOL_SELECT=0
          INTERMEDIATE_POS=1
          ACCURACY_THRES=5000
          EOF
          chmod 0644 ramdisk/madara_gps.conf

          cat << 'EOF' > ramdisk/init.madara.rc
          on property:sys.boot_completed=1
              # VM & Memory (RAM 2GB + ZRAM LZ4)
              write /proc/sys/vm/swappiness 120
              write /proc/sys/vm/vfs_cache_pressure 100
              write /proc/sys/vm/page-cluster 0
              write /proc/sys/vm/dirty_ratio 15
              write /proc/sys/vm/dirty_background_ratio 5
              write /proc/sys/vm/extra_free_kbytes 24300

              # Network Gaming (TCP BBR + FQ + Fast Open)
              write /proc/sys/net/core/default_qdisc fq
              write /proc/sys/net/ipv4/tcp_congestion_control bbr
              write /proc/sys/net/ipv4/tcp_fastopen 3

              # Fast eMMC I/O & Disable SPI CRC
              write /sys/block/mmcblk0/queue/scheduler noop
              write /sys/block/mmcblk0/queue/read_ahead_kb 128
              write /sys/module/mmc_core/parameters/use_spi_crc 0

              # Bypass MTK PPM Thermal & Power Budget Throttle
              write /proc/ppm/policy_status "1 0"
              write /proc/ppm/policy_status "2 0"
              write /proc/ppm/policy_status "3 0"

              # Deep Sleep & Battery Idle Efficiency
              write /sys/power/mem_sleep "deep"
              write /sys/module/workqueue/parameters/power_efficient Y
              write /proc/sys/kernel/timer_migration 0

              # Instant Wakeup & Schedutil Fast Ramp-Up
              write /sys/power/sync_on_suspend 0
              write /sys/devices/system/cpu/cpufreq/schedutil/up_rate_limit_us 500
              write /sys/devices/system/cpu/cpufreq/schedutil/down_rate_limit_us 2000

              # Touch Responsive & CPU Touch Boost
              write /sys/devices/system/cpu/cpufreq/schedutil/hispeed_freq 1800000
              write /sys/devices/system/cpu/cpufreq/schedutil/hispeed_load 75
              write /proc/perfmgr/tchbst/user/usrtch 1
              write /proc/perfmgr/boost_ctrl/eas_ctrl/perfserv_ta_uclamp_min 15

              # Systemless GPS Fast-Lock Mount
              exec - root root -- /system/bin/mount --bind /madara_gps.conf /vendor/etc/gps.conf
          EOF

          chmod 0750 ramdisk/init.madara.rc
          grep -q "init.madara.rc" anykernel.sh || sed -i '/dump_boot;/a import_initrc /init.madara.rc;' anykernel.sh

          ZIP_NAME="madaraKernel-blossom-${{ matrix.variant }}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: madara-b${{ github.run_number }}
          name: madaraKernel Blossom (Build #${{ github.run_number }})
          files: "**/madaraKernel-*.zip"
          prerelease: true

      - name: Send Flashable ZIP & MD5 to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - << 'EOF'
          import glob
          import hashlib
          import os
          import sys
          import urllib.request
          import uuid

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          zip_name = os.environ["ZIP_NAME"]
          matches = glob.glob(os.path.join(workspace, "**", zip_name), recursive=True)

          if not matches:
              sys.exit(f"ERROR: File {zip_name} tidak ditemukan di {workspace}")

          file_path = matches[0]
          with open(file_path, "rb") as f:
              file_data = f.read()

          md5_hash = hashlib.md5(file_data).hexdigest()
          caption = f"<b>madaraKernel ({os.environ['VARIANT']})</b>\nMD5: <code>{md5_hash}</code>"

          boundary = f"----WebKitFormBoundary{uuid.uuid4().hex}"
          body = bytearray()

          fields = {
              "chat_id": os.environ["TG_CHAT_ID"],
              "caption": caption,
              "parse_mode": "HTML",
          }

          for key, val in fields.items():
              body.extend(f"--{boundary}\r\n".encode())
              body.extend(f'Content-Disposition: form-data; name="{key}"\r\n\r\n{val}\r\n'.encode())

          body.extend(f"--{boundary}\r\n".encode())
          body.extend(
              f'Content-Disposition: form-data; name="document"; filename="{os.path.basename(file_path)}"\r\n'
              f"Content-Type: application/zip\r\n\r\n".encode()
          )
          body.extend(file_data)
          body.extend(f"\r\n--{boundary}--\r\n".encode())

          url = f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendDocument"
          req = urllib.request.Request(url, data=bytes(body))
          req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  print("Telegram upload sukses:", resp.status)
          except Exception as e:
              if hasattr(e, "read"):
                  print("Telegram API Error:", e.read().decode())
              sys.exit(f"Gagal kirim ke Telegram: {e}")
          EOF
