name: Build madaraKernel Blossom (Dual-Variant)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Vanilla, RSKSU]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Apply Performance & GPU OC Patches
        run: |
          python3 - << 'EOF'
          import glob, re

          # 1. Matikan GENTLE_FAIR_SLEEPERS di scheduler (UI & Touch lebih instan)
          feat_file = 'kernel/sched/features.h'
          with open(feat_file, 'r') as f:
              feat = f.read()
          feat_new, n1 = re.subn(r'(#define\s+SCHED_FEAT_GENTLE_FAIR_SLEEPERS\s+)1\b', r'\g<1>0', feat)
          if not n1:
              feat_new, n1 = re.subn(r'SCHED_FEAT\(\s*GENTLE_FAIR_SLEEPERS\s*,\s*true\s*\)', 'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)', feat)
          if n1:
              with open(feat_file, 'w') as f:
                  f.write(feat_new)
              print("Patched NO_GENTLE_FAIR_SLEEPERS OK")

          # 2. GPU Overclock PowerVR GE8320 (650 MHz -> 730 MHz)
          gpu_patched = False
          gpu_files = glob.glob('drivers/misc/mediatek/**/*gpufreq*.[ch]', recursive=True)
          target_gpu = [p for p in gpu_files if 'mt6765' in p or 'mt6762' in p] or gpu_files
          for path in target_gpu:
              with open(path, 'r') as f:
                  gpu = f.read()
              gpu_new, n2 = re.subn(r'\b650000\b', '730000', gpu)
              if n2:
                  with open(path, 'w') as f:
                      f.write(gpu_new)
                  print(f"Patched GPU OC 730MHz in {path} ({n2} entries) OK")
                  gpu_patched = True
          if not gpu_patched:
              print("PERINGATAN: Angka 650000 tidak ditemukan, daftar file gpufreq:", target_gpu)

          # 3. CPU Overclock +300 MHz (Big: 2.0 -> 2.3 GHz, Little: 1.5 -> 1.8 GHz)
          for cpu_f in glob.glob('drivers/misc/mediatek/base/power/cpufreq_v1/**/*.[ch]', recursive=True):
              with open(cpu_f, 'r') as f:
                  c_txt = f.read()
              new_c = re.sub(r'\b2000000\b', '2300000', c_txt)
              new_c = re.sub(r'\b1500000\b', '1800000', new_c)
              if new_c != c_txt:
                  with open(cpu_f, 'w') as f:
                      f.write(new_c)
                  print(f"Patched CPU DVFS table (+300MHz) in {cpu_f} OK")
          EOF

      - name: Setup Variant (${{ matrix.variant }})
        run: |
          if [ "${{ matrix.variant }}" == "RSKSU" ]; then
            # 1. Setup ReSukiSU (BakaSU v4.2)
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

            # 2. Clone SUSFS upstream khusus Linux 4.19
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu

            # Salin file core SUSFS ke kernel (JANGAN salin folder KernelSU-nya)
            cp -r susfs4ksu/kernel_patches/fs/* fs/
            cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/

            # Terapkan patch kernel SUSFS 4.19 & cek jika ada hunk MTK yang reject
            patch -p1 --no-backup-if-mismatch -N < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
            if find . -name "*.rej" | grep -q .; then
              echo "=== PERINGATAN: DITEMUKAN FILE .REJ ==="
              find . -name "*.rej" -exec head -n 50 {} +
            fi

            # Pastikan field, header, & inline hook SUSFS masuk ke file yang ter-reject MTK
            python3 - << 'EOF'
          import os, re

          # 1. include/linux/sched.h
          sched_h = 'include/linux/sched.h'
          with open(sched_h, 'r') as f:
              content = f.read()

          if 'susfs_task_state' not in content:
              susfs_fields = (
                  '#ifdef CONFIG_KSU_SUSFS\n'
                  '\tu64 susfs_task_state;\n'
                  '\tu64 susfs_last_fake_mnt_id;\n'
                  '#endif\n'
              )
              content, count = re.subn(
                  r'(\n[ \t]*struct thread_struct[ \t]+thread;)',
                  r'\n' + susfs_fields + r'\1',
                  content,
                  count=1
              )
              assert count == 1, "Gagal menemukan struct thread_struct di include/linux/sched.h"
              with open(sched_h, 'w') as f:
                  f.write(content)
              print("Patched struct task_struct in include/linux/sched.h OK")

          # 2. fs/proc/task_mmu.c
          task_mmu = 'fs/proc/task_mmu.c'
          with open(task_mmu, 'r') as f:
              mmu_code = f.read()

          kstat_def = ''
          for h_path in ['include/linux/susfs_def.h', 'include/linux/fs.h']:
              if os.path.exists(h_path):
                  with open(h_path, 'r') as hf:
                      for line in hf:
                          if 'define INODE_STATE_SUS_KSTAT' in line:
                              kstat_def = line.strip()
                              break
              if kstat_def:
                  break

          if not kstat_def:
              kstat_def = '#define INODE_STATE_SUS_KSTAT BIT(24)'

          inc_block = (
              '#ifdef CONFIG_KSU_SUSFS\n'
              '#include <linux/susfs_def.h>\n'
              '#ifndef INODE_STATE_SUS_KSTAT\n'
              f'{kstat_def}\n'
              '#endif\n'
              '#endif\n'
          )

          if 'INODE_STATE_SUS_KSTAT' not in mmu_code.split('#include')[0]:
              mmu_code = re.sub(r'(#include\s+[<"])', inc_block + r'\1', mmu_code, count=1)
              with open(task_mmu, 'w') as f:
                  f.write(mmu_code)
              print(f"Patched fs/proc/task_mmu.c OK ({kstat_def})")

          # 3. kernel/sys.c (ksu_handle_setresuid untuk SUSFS Inline Hook)
          sys_c = 'kernel/sys.c'
          with open(sys_c, 'r') as f:
              sys_code = f.read()

          if 'ksu_handle_setresuid' not in sys_code:
              decl_setresuid = (
                  '#ifdef CONFIG_KSU_SUSFS\n'
                  'extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n'
                  '#endif\n\n'
              )
              hook_setresuid = (
                  '\n#ifdef CONFIG_KSU_SUSFS\n'
                  '\tksu_handle_setresuid(ruid, euid, suid);\n'
                  '#endif\n'
              )
              target_sig = 'long __sys_setresuid(' if 'long __sys_setresuid(' in sys_code else 'SYSCALL_DEFINE3(setresuid,'
              idx = sys_code.index(target_sig)
              before, after = sys_code[:idx], sys_code[idx:]
              after = after.replace('{', '{' + hook_setresuid, 1)
              with open(sys_c, 'w') as f:
                  f.write(before + decl_setresuid + after)
              print(f"Patched ksu_handle_setresuid in {sys_c} ({target_sig}) OK")

          # 4. Pastikan semua inline hook SUSFS terpasang jika ada hunk MTK yang reject
          # 4a. fs/exec.c (ksu_handle_execveat)
          with open('fs/exec.c', 'r') as f:
              exec_c = f.read()
          if 'ksu_handle_execveat' not in exec_c:
              sig_exec = 'static int __do_execve_file('
              idx = exec_c.rindex(sig_exec)
              before, after = exec_c[:idx], exec_c[idx:]
              pattern = r'(if\s*\(\s*IS_ERR\s*\(\s*filename\s*\)\s*\)\s*(?:\{\s*)?return\s+PTR_ERR\s*\(\s*filename\s*\)\s*;(?:\s*\})?)'
              ksu_exec_hook = (
                  r'\1\n\n#ifdef CONFIG_KSU_SUSFS\n'
                  r'\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
                  r'#endif'
              )
              after = re.sub(pattern, ksu_exec_hook, after, count=1)
              decl_exec = (
                  '#ifdef CONFIG_KSU_SUSFS\n'
                  'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
                  '#endif\n\n'
              )
              with open('fs/exec.c', 'w') as f:
                  f.write(before + decl_exec + after)
              print("Patched ksu_handle_execveat in fs/exec.c OK")

          # 4b. fs/open.c (ksu_handle_faccessat)
          with open('fs/open.c', 'r') as f:
              open_c = f.read()
          if 'ksu_handle_faccessat' not in open_c:
              idx = open_c.rindex('long do_faccessat(')
              before, after = open_c[:idx], open_c[idx:]
              after = after.replace(
                  '\tunsigned int lookup_flags = LOOKUP_FOLLOW;',
                  '\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n#ifdef CONFIG_KSU_SUSFS\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif',
                  1
              )
              decl = '#ifdef CONFIG_KSU_SUSFS\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\n'
              with open('fs/open.c', 'w') as f:
                  f.write(before + decl + after)
              print("Patched ksu_handle_faccessat in fs/open.c OK")

          # 4c. fs/stat.c (ksu_handle_stat)
          with open('fs/stat.c', 'r') as f:
              stat_c = f.read()
          if 'ksu_handle_stat' not in stat_c:
              idx = stat_c.rindex('int vfs_statx(')
              before, after = stat_c[:idx], stat_c[idx:]
              after = after.replace(
                  '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;',
                  '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n#ifdef CONFIG_KSU_SUSFS\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif',
                  1
              )
              decl = '#ifdef CONFIG_KSU_SUSFS\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n\n'
              with open('fs/stat.c', 'w') as f:
                  f.write(before + decl + after)
              print("Patched ksu_handle_stat in fs/stat.c OK")

          # 4d. fs/read_write.c (ksu_handle_sys_read untuk SUSFS Inline Hook)
          with open('fs/read_write.c', 'r') as f:
              rw_c = f.read()
          if 'ksu_handle_sys_read' not in rw_c:
              sig_read = 'SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)'
              idx = rw_c.index(sig_read)
              before, after = rw_c[:idx], rw_c[idx:]
              decl_read = (
                  '#ifdef CONFIG_KSU_SUSFS\n'
                  'extern bool ksu_init_rc_hook __read_mostly;\n'
                  'extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n'
                  '#endif\n\n'
              )
              hook_read = (
                  '\n#ifdef CONFIG_KSU_SUSFS\n'
                  '\tif (unlikely(ksu_init_rc_hook))\n'
                  '\t\tksu_handle_sys_read(fd, &buf, &count);\n'
                  '#endif'
              )
              after = after.replace('{', '{' + hook_read, 1)
              with open('fs/read_write.c', 'w') as f:
                  f.write(before + decl_read + after)
              print("Patched ksu_handle_sys_read in fs/read_write.c OK")

          inline_mk = 'KernelSU/kernel/tools/inline_hook_check.mk'
          if os.path.exists(inline_mk):
              print("=== ISI inline_hook_check.mk ===")
              with open(inline_mk, 'r') as f:
                  print(f.read())
          EOF

            # 3. Patch kompatibilitas pkg_observer.c untuk Linux 4.19 (TWA_RESUME & fsnotify_ops)
            python3 - << 'EOF'
          import os, re

          pkg_obs = 'drivers/kernelsu/manager/pkg_observer.c'
          if os.path.exists(pkg_obs):
              with open(pkg_obs, 'r') as f:
                  code = f.read()
              code = code.replace('TWA_RESUME', 'true')
              if '.handle_inode_event' in code:
                  wrapper = (
                      'static int ksu_handle_event_419(struct fsnotify_group *group, struct inode *inode, '
                      'u32 mask, const void *data, int data_type, const unsigned char *file_name, '
                      'u32 cookie, struct fsnotify_iter_info *iter_info)\n'
                      '{\n'
                      '\tstruct qstr qname = { .name = file_name, .len = file_name ? strlen(file_name) : 0 };\n'
                      '\treturn ksu_handle_inode_event(NULL, mask, inode, inode, file_name ? &qname : NULL, cookie);\n'
                      '}\n\n'
                      'static const struct fsnotify_ops'
                  )
                  code = code.replace('static const struct fsnotify_ops', wrapper, 1)
                  code = re.sub(r'\.handle_inode_event\s*=\s*ksu_handle_inode_event', '.handle_event = ksu_handle_event_419', code)
              with open(pkg_obs, 'w') as f:
                  f.write(code)
              print("Patched pkg_observer.c for Linux 4.19 OK")
          EOF

            # 4. Aktifkan konfigurasi KSU + SUSFS di blossom_defconfig
            cat << 'EOF' >> arch/arm64/configs/blossom_defconfig
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          # CONFIG_KPROBES is not set
          EOF
          fi

      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="ZexxaDev"
          export KBUILD_BUILD_HOST="GitHubActions"

          make -j$(nproc --all) O=out ARCH=arm64 blossom_defconfig

          if [ "${{ matrix.variant }}" == "RSKSU" ]; then
            grep -q "CONFIG_KSU=y" out/.config || (echo "ERROR: CONFIG_KSU=y gagal aktif di .config!" && exit 1)
            grep -q "CONFIG_KSU_SUSFS=y" out/.config || (echo "ERROR: CONFIG_KSU_SUSFS=y gagal aktif di .config!" && exit 1)
          fi

          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log || {
              echo "=== RINGKASAN ERROR ==="
              grep -iE "error:|undefined symbol|undefined reference" build.log | tail -n 25
              exit 1
            }

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/

          cd anykernel

          sed -i 's/kernel.string=.*/kernel.string=madaraKernel 4.19.325 (${{ matrix.variant }}) by @zexxadev/g' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=dandelion/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=blossom/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=angelica/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=cattail/g' anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0;/g' anykernel.sh

          cat << 'EOF' > ramdisk/init.madara.rc
          on property:sys.boot_completed=1
              # VM & Memory (RAM 2GB + ZRAM LZ4)
              write /proc/sys/vm/swappiness 120
              write /proc/sys/vm/vfs_cache_pressure 100
              write /proc/sys/vm/page-cluster 0

              # Network Gaming (TCP BBR + FQ + Fast Open)
              write /proc/sys/net/core/default_qdisc fq
              write /proc/sys/net/ipv4/tcp_congestion_control bbr
              write /proc/sys/net/ipv4/tcp_fastopen 3

              # Fast eMMC I/O & Disable SPI CRC
              write /sys/block/mmcblk0/queue/scheduler noop
              write /sys/block/mmcblk0/queue/read_ahead_kb 128
              write /sys/module/mmc_core/parameters/use_spi_crc 0

              # Bypass MTK PPM Thermal & Power Budget Throttle
              write /proc/ppm/policy_status "1 0"
              write /proc/ppm/policy_status "2 0"
              write /proc/ppm/policy_status "3 0"

              # Instant Wakeup & Schedutil Fast Ramp-Up (untuk CPU OC 2.3GHz)
              write /sys/power/sync_on_suspend 0
              write /sys/devices/system/cpu/cpufreq/schedutil/up_rate_limit_us 500
              write /sys/devices/system/cpu/cpufreq/schedutil/down_rate_limit_us 2000
          EOF
          chmod 0750 ramdisk/init.madara.rc

          sed -i '/dump_boot;/a import_initrc /init.madara.rc;' anykernel.sh

          ZIP_NAME="madaraKernel-blossom-${{ matrix.variant }}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}