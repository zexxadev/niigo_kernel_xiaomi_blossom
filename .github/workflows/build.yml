name: Build madaraKernel Blossom (Dual-Variant)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Vanilla, RSKSU]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Apply Performance & GPU OC Patches
        run: |
          python3 - << 'EOF'
          import glob

          # 1. Matikan GENTLE_FAIR_SLEEPERS di scheduler (UI & Touch lebih instan)
          feat_file = 'kernel/sched/features.h'
          with open(feat_file, 'r') as f:
              feat = f.read()
          if 'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, true)' in feat:
              feat = feat.replace('SCHED_FEAT(GENTLE_FAIR_SLEEPERS, true)', 'SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)', 1)
              with open(feat_file, 'w') as f:
                  f.write(feat)
              print("Patched NO_GENTLE_FAIR_SLEEPERS OK")

          # 2. GPU Overclock PowerVR GE8320 (650 MHz -> 730 MHz)
          for path in glob.glob('drivers/misc/mediatek/base/power/**/mtk_gpufreq*.c', recursive=True):
              with open(path, 'r') as f:
                  gpu = f.read()
              if 'GPUOP(650000,' in gpu:
                  gpu = gpu.replace('GPUOP(650000,', 'GPUOP(730000,')
                  with open(path, 'w') as f:
                      f.write(gpu)
                  print(f"Patched GPU OC 730MHz in {path} OK")
          EOF

      - name: Setup Variant (${{ matrix.variant }})
        run: |
          if [ "${{ matrix.variant }}" == "RSKSU" ]; then
            # 1. Setup ReSukiSU
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
            
            # 2. Clone & Apply SUSFS 4.19 Patches
            git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs
            cp susfs/kernel_patches/fs/* fs/
            cp susfs/kernel_patches/include/linux/* include/linux/
            
            # Terapkan patch manual SUSFS ke fs/exec.c dan fs/open.c jika diperlukan oleh susfs
            echo "Applying SUSFS integration patches..."
            
            echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/blossom_defconfig
            echo "CONFIG_KSU=y" >> arch/arm64/configs/blossom_defconfig
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/blossom_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/blossom_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/blossom_defconfig
            echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/blossom_defconfig
          fi

          python3 - << 'EOF'
          import re

          def patch_file(path, func_sig, extern_decl, hook_target, hook_code):
              with open(path, 'r') as f:
                  content = f.read()
              if func_sig not in content:
                  return
              idx = content.rindex(func_sig)
              before = content[:idx]
              after = content[idx:]
              if hook_target not in after:
                  return
              after = after.replace(hook_target, hook_code, 1)
              with open(path, 'w') as f:
                  f.write(before + extern_decl + '\n\n' + after)
              print(f"Patched {path} OK")

          # ReSukiSU / KSU Manual Hooks (jika dibutuhkan oleh versi source)
          patch_file(
              'fs/open.c',
              'long do_faccessat(',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif',
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW;',
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif'
          )
          patch_file(
              'fs/read_write.c',
              'ssize_t vfs_read(',
              '#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif',
              '\tssize_t ret;',
              '\tssize_t ret;\n\n#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif'
          )
          patch_file(
              'fs/stat.c',
              'int vfs_statx(',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif',
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;',
              '\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;\n\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif'
          )
          EOF

      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Zexxa"
          export KBUILD_BUILD_HOST="GitHubActions"

          make -j$(nproc --all) O=out ARCH=arm64 blossom_defconfig

          if [ "${{ matrix.variant }}" == "RSKSU" ]; then
            grep -q "CONFIG_KSU=y" out/.config || (echo "ERROR: CONFIG_KSU=y gagal aktif di .config!" && exit 1)
            grep -q "CONFIG_KSU_SUSFS=y" out/.config || (echo "ERROR: CONFIG_KSU_SUSFS=y gagal aktif di .config!" && exit 1)
          fi

          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log || {
              echo "=== RINGKASAN ERROR ==="
              grep -iE "error:|undefined symbol|undefined reference" build.log | tail -n 25
              exit 1
            }

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/

          cd anykernel

          sed -i 's/kernel.string=.*/kernel.string=madaraKernel 4.19.325 (${{ matrix.variant }}+SUSFS) by @zexxadev/g' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=dandelion/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=blossom/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=angelica/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=cattail/g' anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0;/g' anykernel.sh

          cat << 'EOF' > ramdisk/init.madara.rc
          on property:sys.boot_completed=1
              # VM & Memory (RAM 2GB + ZRAM LZ4)
              write /proc/sys/vm/swappiness 120
              write /proc/sys/vm/vfs_cache_pressure 100
              write /proc/sys/vm/page-cluster 0

              # Network Gaming (TCP BBR + FQ)
              write /proc/sys/net/core/default_qdisc fq
              write /proc/sys/net/ipv4/tcp_congestion_control bbr

              # Fast eMMC I/O & Disable SPI CRC
              write /sys/block/mmcblk0/queue/scheduler noop
              write /sys/block/mmcblk0/queue/read_ahead_kb 128
              write /sys/module/mmc_core/parameters/use_spi_crc 0

              # Bypass MTK PPM Thermal & Power Budget Throttle
              write /proc/ppm/policy_status "1 0"
              write /proc/ppm/policy_status "2 0"
              write /proc/ppm/policy_status "3 0"
          EOF
          chmod 0750 ramdisk/init.madara.rc

          sed -i '/dump_boot;/a import_initrc /init.madara.rc;' anykernel.sh

          ZIP_NAME="madaraKernel-blossom-${{ matrix.variant }}-SUSFS-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}